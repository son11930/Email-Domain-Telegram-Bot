name: team-mail
x-common: &common
  image: team-mail:local
  build:
    context: ..
    dockerfile: deploy/Dockerfile
  env_file:
    - ../.env
  restart: unless-stopped
  init: true
  read_only: true
  tmpfs:
    - /tmp:size=32m,mode=1777
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: '3'
services:
  bot:
    <<: *common
    command: ["team-mail", "bot"]
  worker:
    <<: *common
    command: ["team-mail", "worker"]
  web:
    <<: *common
    command: ["team-mail", "web"]
    environment:
      WEB_HOST: 0.0.0.0
    ports:
      - '127.0.0.1:8001:8001'
