[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "team-mail-bot"
version = "0.1.0"
description = "Telegram domain email inventory, credit wallet and private admin panel"
requires-python = ">=3.11"
dependencies = [
  "aiogram>=3.20,<4", "SQLAlchemy>=2.0.40,<3", "psycopg[binary]>=3.2,<4",
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "httpx>=0.28,<1",
  "jinja2>=3.1.6,<4", "python-multipart>=0.0.20,<1", "python-dotenv>=1.1,<2",
  "itsdangerous>=2.2,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "ruff>=0.11,<1", "pip-audit>=2.9,<3"]

[project.scripts]
team-mail = "team_mail_bot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
team_mail_bot = ["templates/*.html", "templates/**/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
markers = ["postgres: requires TEST_DATABASE_URL pointing to a disposable PostgreSQL database"]

[tool.coverage.run]
source = ["team_mail_bot"]
branch = true

[tool.ruff]
target-version = "py311"
line-length = 100
